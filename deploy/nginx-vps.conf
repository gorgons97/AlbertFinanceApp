# ============================================================
# Albert — configurazione nginx per la VPS (reverse proxy + HTTPS)
# ============================================================
# Istruzioni (da eseguire come root sulla VPS):
#   1. Copiare questo file in /etc/nginx/sites-available/albert
#   2. Sostituire TUODOMINIO.it con il dominio reale (es. albert.duckdns.org)
#   3. ln -s /etc/nginx/sites-available/albert /etc/nginx/sites-enabled/
#   4. Ottenere il certificato Let's Encrypt:
#        apt install certbot python3-certbot-nginx
#        certbot --nginx -d TUODOMINIO.it
#   5. nginx -t && systemctl reload nginx
#   6. Firewall (UFW): chiudere le porte dirette del container:
#        ufw allow 22/tcp && ufw allow 80/tcp && ufw allow 443/tcp
#        ufw deny 3001/tcp && ufw deny 8001/tcp
#        ufw enable
# ============================================================

# HTTP -> HTTPS (redirect)
server {
    listen 80;
    server_name TUODOMINIO.it;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name TUODOMINIO.it;

    # Certificati (generati da certbot)
    ssl_certificate     /etc/letsencrypt/live/TUODOMINIO.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TUODOMINIO.it/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Headers di sicurezza
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Frontend (container webpack dev server, porta host 3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (container FastAPI, porta host 8001)
    # Il frontend chiama /api sulla stessa origine -> nginx inoltra al backend
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
