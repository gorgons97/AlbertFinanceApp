services:
  db:
    image: postgres:15
    container_name: albert_db
    environment:
      POSTGRES_USER: albert
      POSTGRES_PASSWORD: AlbertPig2025!
      POSTGRES_DB: albert_app
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albert -d albert_app"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  backend:
    build: ./backend_python
    container_name: albert_backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend_python:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://albert:AlbertPig2025!@db:5432/albert_app
      SECRET_KEY: ${SECRET_KEY:-chiave-di-sviluppo-NON-usare-in-produzione}
      CORS_ORIGINS: ${CORS_ORIGINS:-}

  frontend:
    build: ./frontend
    container_name: albert_frontend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - REACT_APP_API_BASE=${REACT_APP_API_BASE:-}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data: