version: '3.8'

services:
  db:
    image: postgres:15
    container_name: my_fin_app_db
    environment:
      POSTGRES_USER: albert
      POSTGRES_PASSWORD: AlbertPig2025!
      POSTGRES_DB: albert_app
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: