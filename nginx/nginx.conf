# ============================================================
# Albert — configurazione nginx per la VPS (reverse proxy + HTTPS)
# ============================================================
# Istruzioni (da eseguire come root sulla VPS):
#   1. Copiare questo file in /etc/nginx/sites-available/albert
#   2. Sostituire localhost con il dominio reale (es. albert.duckdns.org)
#   3. ln -s /etc/nginx/sites-available/albert /etc/nginx/sites-enabled/
#   4. Ottenere il certificato Let's Encrypt:
#        apt install certbot python3-certbot-nginx
#        certbot --nginx -d localhost
#   5. nginx -t && systemctl reload nginx
#   6. Firewall (UFW): chiudere le porte dirette del container:
#        ufw allow 22/tcp && ufw allow 80/tcp && ufw allow 443/tcp
#        ufw deny 3001/tcp && ufw deny 8001/tcp
#        ufw enable
# ============================================================

# Resolver DNS Docker interno: evita che nginx cachei gli IP dei container
# e si rompa dopo riavvii con 502 "Connection refused".
resolver 127.0.0.11 valid=5s;

# HTTP
server {
    listen 80;
    server_name localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Usiamo variabili per forzare il resolver dinamico a risolvere l'IP ad ogni richiesta
    # così Nginx non va in 502 se backend o gotrue cambiano IP interno di Docker
    set $upstream_gotrue http://gotrue:9999;
    set $upstream_backend http://backend:8000;
    set $upstream_frontend http://frontend:3000;

    # GoTrue Auth API su HTTP
    location /auth/v1/ {
        rewrite ^/auth/v1/(.*) /$1 break;
        proxy_pass $upstream_gotrue;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API su HTTP
    location /api/ {
        rewrite ^/api/(.*) /api/$1 break;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Proxy per GoTrue su porta 9999 (compatibilità sia con /auth/v1/ che con root)
server {
    listen 9999;
    server_name localhost;
    
    set $upstream_gotrue http://gotrue:9999;

    location /auth/v1/ {
        rewrite ^/auth/v1/(.*) /$1 break;
        proxy_pass $upstream_gotrue;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $upstream_gotrue;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name localhost;

    set $upstream_gotrue http://gotrue:9999;
    set $upstream_backend http://backend:8000;
    set $upstream_frontend http://frontend:3000;

    # Certificati self-signed (per sviluppo)
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    # Per produzione, cambia con i percorsi Let's Encrypt

    # Headers di sicurezza
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Frontend (container webpack dev server, porta host 3000)
    location / {
        proxy_pass $upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (container FastAPI, porta host 8000)
    # Il frontend chiama /api sulla stessa origine -> nginx inoltra al backend
    location /api/ {
        rewrite ^/api/(.*) /api/$1 break;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GoTrue Auth API
    location /auth/v1/ {
        rewrite ^/auth/v1/(.*) /$1 break;
        proxy_pass $upstream_gotrue;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
