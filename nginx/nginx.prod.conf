# ============================================================
# Albert — nginx per la PRODUZIONE (VPS)
# ============================================================
# USO (insieme a docker-compose.prod.yml):
#   1. Sostituisci TUODOMINIO.it col dominio reale (es. albert.duckdns.org)
#      in TUTTO questo file.
#   2. Assicurati che il dominio punti all'IP della VPS.
#   3. Ottieni il certificato Let's Encrypt (una tantum, sul server):
#        docker run --rm -v /etc/letsencrypt:/etc/letsencrypt \
#          -p 80:80 certbot/certbot certonly --standalone \
#          -d TUODOMINIO.it --non-interactive --agree-tos -m TUOEMAIL@example.com
#      (deve girare quando nginx NON occupa la porta 80, quindi PRIMA di
#       avviare il compose, oppure fermando nginx: docker compose -f docker-compose.prod.yml stop nginx)
#   4. Avvia tutto:  docker compose --env-file .env-vps -f docker-compose.prod.yml up -d
# ============================================================

# Resolver DNS Docker interno: evita che nginx cachei gli IP dei container
# e si rompa dopo riavvii con 502 "Connection refused".
resolver 127.0.0.11 valid=5s;

# HTTP -> HTTPS (redirect)
server {
    listen 80;
    server_name TUODOMINIO.it;

    # Percorso usato da certbot per la verifica del dominio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name TUODOMINIO.it;

    # Certificati Let's Encrypt (generati da certbot)
    ssl_certificate     /etc/letsencrypt/live/TUODOMINIO.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TUODOMINIO.it/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Headers di sicurezza
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Frontend (container webpack dev server, rete interna)
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (il frontend chiama /api sulla stessa origine)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Autenticazione Supabase (GoTrue)
    location /auth/v1/ {
        proxy_pass http://gotrue:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
