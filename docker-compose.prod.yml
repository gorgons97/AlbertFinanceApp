# ============================================================
# Albert — docker-compose per la PRODUZIONE (VPS)
# ============================================================
# USO:
#   docker compose --env-file .env-vps -f docker-compose.prod.yml up -d --build
#
# Differenze rispetto a docker-compose.yml (dev):
#   - NESSUNA porta pubblica per db/backend/frontend: solo nginx espone 80/443
#   - NESSUN volume di codice: le immagini contengono il codice (buildato)
#   - Variabili da .env-vps (SECRET_KEY, CORS_ORIGINS, POSTGRES_PASSWORD)
# ============================================================

services:
  db:
    image: postgres:15
    container_name: albert_db
    environment:
      POSTGRES_USER: albert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: albert_app
    # nessuna porta pubblica in produzione
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albert -d albert_app"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  backend:
    build: ./backend_python
    container_name: albert_backend
    # nessuna porta pubblica: raggiungibile solo via rete docker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://albert:${POSTGRES_PASSWORD}@db:5432/albert_app
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}

  frontend:
    build: ./frontend
    container_name: albert_frontend
    environment:
      # Vuoto: le chiamate del frontend hanno già il prefisso /api e in HTTPS
      # diventano same-origin -> nginx inoltra al backend.
      REACT_APP_API_BASE: ""
    depends_on:
      - backend
    restart: unless-stopped

  gotrue:
    image: supabase/gotrue:v2.158.1
    container_name: albert_gotrue
    expose:
      - "9999"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgresql://albert:${POSTGRES_PASSWORD}@db:5432/albert_app?sslmode=disable&search_path=auth
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${SECRET_KEY}
      GOTRUE_JWT_EXP: 86400
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-false}"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOTRUE_EXTERNAL_GOOGLE_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: "${GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI:-}"
      GOTRUE_SMTP_HOST: "${SMTP_HOST:-}"
      GOTRUE_SMTP_PORT: "${SMTP_PORT:-587}"
      GOTRUE_SMTP_USER: "${SMTP_USER:-}"
      GOTRUE_SMTP_PASS: "${SMTP_PASS:-}"
      GOTRUE_SMTP_ADMIN_EMAIL: "${SMTP_ADMIN_EMAIL:-admin@albert.local}"

  nginx:
    image: nginx:alpine
    container_name: albert_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  db_data:
