# ============================================================
# Albert — docker-compose per la PRODUZIONE (VPS)
# ============================================================
# USO:
#   docker compose --env-file .env-vps -f docker-compose.prod.yml up -d --build
#
# Differenze rispetto a docker-compose.yml (dev):
#   - NESSUNA porta pubblica per db/backend/frontend: solo nginx espone 80/443
#   - NESSUN volume di codice: le immagini contengono il codice (buildato)
#   - Variabili da .env-vps (SECRET_KEY, CORS_ORIGINS, POSTGRES_PASSWORD)
# ============================================================

services:
  db:
    image: postgres:15
    container_name: albert_db
    environment:
      POSTGRES_USER: albert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: albert_app
    # nessuna porta pubblica in produzione
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albert -d albert_app"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  backend:
    build: ./backend_python
    container_name: albert_backend
    # nessuna porta pubblica: raggiungibile solo via rete docker
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://albert:${POSTGRES_PASSWORD}@db:5432/albert_app
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}

  frontend:
    build: ./frontend
    container_name: albert_frontend
    environment:
      # Vuoto: le chiamate del frontend hanno già il prefisso /api e in HTTPS
      # diventano same-origin -> nginx inoltra al backend.
      REACT_APP_API_BASE: ""
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: albert_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  db_data:
